<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Setup - Ghost OS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      max-width: 500px;
      width: 100%;
      padding: 40px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .platform-icon {
      font-size: 4em;
      margin-bottom: 15px;
    }

    .platform-name {
      font-size: 1.8em;
      font-weight: 700;
      color: #333;
      margin-bottom: 10px;
    }

    .security-badge {
      display: inline-block;
      background: #e8f5e9;
      color: #2e7d32;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85em;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .description {
      color: #666;
      font-size: 0.95em;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
      font-size: 0.95em;
    }

    .form-group input {
      width: 100%;
      padding: 14px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1em;
      transition: all 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
    }

    .btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.1em;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102,126,234,0.4);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: #e8f5e9;
      color: #2e7d32;
      border: 2px solid #4caf50;
    }

    .message.error {
      background: #ffebee;
      color: #c62828;
      border: 2px solid #f44336;
    }

    .loading {
      text-align: center;
      padding: 40px;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .security-info {
      background: #f5f5f5;
      border-left: 4px solid #667eea;
      padding: 16px;
      border-radius: 8px;
      margin-top: 20px;
      font-size: 0.9em;
      color: #555;
    }

    .security-info strong {
      color: #333;
    }

    .oauth-info {
      text-align: center;
      padding: 30px;
    }

    .oauth-info p {
      margin-bottom: 20px;
      color: #666;
      line-height: 1.6;
    }

    .expired {
      text-align: center;
      padding: 20px;
    }

    .expired-icon {
      font-size: 4em;
      margin-bottom: 20px;
    }

    .expired h2 {
      color: #333;
      margin-bottom: 10px;
    }

    .expired p {
      color: #666;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Loading State -->
    <div id="loadingState" class="loading">
      <div class="spinner"></div>
      <p>Validating secure link...</p>
    </div>

    <!-- Setup Form -->
    <div id="setupForm" style="display: none;">
      <div class="header">
        <div class="platform-icon" id="platformIcon"></div>
        <div class="security-badge">🔐 Secure Setup</div>
        <h1 class="platform-name" id="platformName"></h1>
        <p class="description" id="platformDescription"></p>
      </div>

      <div id="messageBox" class="message"></div>

      <form id="configForm" onsubmit="saveConfiguration(event)">
        <div id="formFields"></div>

        <button type="submit" class="btn" id="submitBtn">
          Connect <span id="platformNameBtn"></span>
        </button>
      </form>

      <div class="security-info">
        <strong>🔒 Your data is secure:</strong><br>
        • All keys are encrypted before storage<br>
        • This link expires in 1 hour<br>
        • Single-use only (can't be reused)<br>
        • We never see your credentials
      </div>
    </div>

    <!-- OAuth Info -->
    <div id="oauthInfo" style="display: none;">
      <div class="oauth-info">
        <div class="platform-icon" id="oauthIcon"></div>
        <h1 class="platform-name" id="oauthName"></h1>
        <p id="oauthMessage"></p>
        <button onclick="startOAuth()" class="btn">Authorize Access</button>
      </div>
    </div>

    <!-- Expired/Invalid -->
    <div id="expiredState" style="display: none;">
      <div class="expired">
        <div class="expired-icon">⏱️</div>
        <h2>Link Expired or Invalid</h2>
        <p id="expiredMessage"></p>
      </div>
    </div>
  </div>

  <script>
    let tokenData = null;
    let platformConfig = null;

    // Get token from URL
    const urlPath = window.location.pathname;
    const token = urlPath.split('/setup/')[1];

    if (!token) {
      showExpired('Invalid setup link');
    } else {
      validateToken();
    }

    // Validate token and load platform config
    async function validateToken() {
      try {
        const response = await fetch(`/api/setup/validate/${token}`);
        const data = await response.json();

        if (data.valid) {
          tokenData = data.tokenData;
          platformConfig = data.platform;

          if (platformConfig.oauth) {
            showOAuthInfo();
          } else {
            showSetupForm();
          }
        } else {
          showExpired(data.error || 'This link is no longer valid');
        }

      } catch (error) {
        console.error('Validation error:', error);
        showExpired('Failed to validate link. Please try again.');
      }
    }

    // Show setup form
    function showSetupForm() {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('setupForm').style.display = 'block';

      document.getElementById('platformIcon').textContent = platformConfig.icon;
      document.getElementById('platformName').textContent = platformConfig.name;
      document.getElementById('platformNameBtn').textContent = platformConfig.name;
      document.getElementById('platformDescription').textContent =
        `Enter your ${platformConfig.name} API credentials below. They'll be encrypted and stored securely.`;

      // Generate form fields
      const formFields = document.getElementById('formFields');
      formFields.innerHTML = platformConfig.fields.map(field => `
        <div class="form-group">
          <label for="${field.name}">
            ${field.label}${field.required ? ' *' : ''}
          </label>
          <input
            type="${field.type}"
            id="${field.name}"
            name="${field.name}"
            placeholder="${field.placeholder || ''}"
            ${field.required ? 'required' : ''}
          />
        </div>
      `).join('');
    }

    // Show OAuth info
    function showOAuthInfo() {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('oauthInfo').style.display = 'block';

      document.getElementById('oauthIcon').textContent = platformConfig.icon;
      document.getElementById('oauthName').textContent = platformConfig.name;
      document.getElementById('oauthMessage').textContent = platformConfig.message;
    }

    // Show expired message
    function showExpired(message) {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('expiredState').style.display = 'block';
      document.getElementById('expiredMessage').textContent = message;
    }

    // Save configuration
    async function saveConfiguration(event) {
      event.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Connecting...';

      const messageBox = document.getElementById('messageBox');
      messageBox.className = 'message';
      messageBox.style.display = 'none';

      try {
        // Gather form data
        const formData = new FormData(event.target);
        const config = {};
        for (const [key, value] of formData.entries()) {
          config[key] = value;
        }

        // Submit configuration
        const response = await fetch(`/api/setup/save/${token}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ config })
        });

        const data = await response.json();

        if (data.success) {
          messageBox.className = 'message success show';
          messageBox.textContent = `✅ ${data.message}`;

          // Clear form
          event.target.reset();

          // Show success for 2 seconds, then show "all done" message
          setTimeout(() => {
            document.getElementById('setupForm').innerHTML = `
              <div style="text-align: center; padding: 40px;">
                <div style="font-size: 4em; margin-bottom: 20px;">✅</div>
                <h2 style="color: #2e7d32; margin-bottom: 15px;">All Set!</h2>
                <p style="color: #666; line-height: 1.6;">
                  ${platformConfig.name} is now connected to your Ghost OS.<br>
                  You can close this page and start using it.
                </p>
              </div>
            `;
          }, 2000);

        } else {
          messageBox.className = 'message error show';
          messageBox.textContent = `❌ ${data.error}`;
          submitBtn.disabled = false;
          submitBtn.textContent = `Connect ${platformConfig.name}`;
        }

      } catch (error) {
        console.error('Save error:', error);
        messageBox.className = 'message error show';
        messageBox.textContent = '❌ Failed to save. Please try again.';
        submitBtn.disabled = false;
        submitBtn.textContent = `Connect ${platformConfig.name}`;
      }
    }

    // Start OAuth flow
    function startOAuth() {
      // Will be implemented with OAuth handlers
      alert('OAuth flow coming soon!');
    }
  </script>
</body>
</html>
